[package]
name = "dartclip-core"
version.workspace = true
edition.workspace = true

[dependencies]
ab_glyph = "0.2"
anyhow = "1"
base64 = "0.22"
html-escape = "0.2"
log = "0.4"
fs2 = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "gzip", "brotli", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["process", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
