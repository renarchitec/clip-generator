name: Build Rust worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - 'worker-rust/**'
      - 'worker/fonts/**'
      - '.github/workflows/build-rust-worker.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dartclip-worker-rust"
          {
            echo 'tags<<EOF'
            echo "${image}:latest"
            echo "${image}:${GITHUB_SHA}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: worker-rust/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=dartclip-worker-rust
          cache-to: type=gha,scope=dartclip-worker-rust,mode=max
